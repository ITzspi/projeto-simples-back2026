name: Deploy Render via Tag

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Mostrar tag detectada
        run: echo "Iniciando deploy automático para a tag ${GITHUB_REF_NAME}"

      - name: Identificar commit associado à tag
        run: |
          echo "COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Commit associado à tag: $(git rev-parse HEAD)"

      - name: Chamar Render API para deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

        run: |
          echo "Enviando requisição para deploy..."

          curl --fail-with-body --silent --show-error \
            -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -d "{\"commitId\":\"${COMMIT_SHA}\"}"

          echo "Deploy solicitado com sucesso!"